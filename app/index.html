<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9ece8; --sheet:#f7f8f5; --band:#e1e6e2; --head:#d8dfda;
  --ink:#14212b; --ink2:#52606d; --faint:#9aa6ad; --rule:#cbd3ce;
  --sel:#d3e6e4; --selrow:#e3efed; --accent:#0e7c7b; --accent-ink:#ffffff;
  --led:#f0a30e; --err:#c0392b; --warn:#a8650b;
  --hatch:repeating-linear-gradient(135deg,transparent 0 5px,rgba(20,33,43,.07) 5px 6px);
  --t-cc:#dbe8f6; --t-nrpn:#e6e0f3; --t-note:#dcefdc; --t-pc:#f6e8cc; --t-at:#f3dcdc; --t-gsxg:#d9eeee; --t-pb:#eadfd0;
  --ui:"Barlow Semi Condensed",system-ui,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#10161b; --sheet:#171f26; --band:#1e2830; --head:#232e37;
    --ink:#e4e9ec; --ink2:#9fadb7; --faint:#5d6c77; --rule:#2c3943;
    --sel:#1d3d40; --selrow:#1a2f33; --accent:#4fc1bc; --accent-ink:#0a1417;
    --led:#f5b53a; --err:#ff7a6b; --warn:#e0a24a;
    --hatch:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.05) 5px 6px);
    --t-cc:#22405c; --t-nrpn:#3b3260; --t-note:#244a2e; --t-pc:#5a4519; --t-at:#5a2b2b; --t-gsxg:#1d4a4a; --t-pb:#4f3d28;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.3 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--ink2)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],select,textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:3px 6px}

#top{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--sheet);flex-wrap:wrap}
.brand{font-weight:600;font-size:18px;letter-spacing:.02em}
.brand small{font-weight:400;color:var(--ink2);font-size:13px;margin-left:8px}
.actions{display:flex;gap:6px;margin-left:auto}
.nav-dummy{}
#nav{grid-column:1;overflow:auto;background:var(--paper);border-right:1px solid var(--rule);padding:14px 0}
#nav .ni{display:flex;align-items:center;gap:8px;width:100%;border:0;border-left:4px solid transparent;border-radius:0;background:none;text-align:left;padding:9px 12px 9px calc(14px + var(--d,0) * 14px);font-size:16px;color:var(--ink2)}
#nav button.ni:hover{background:var(--band);color:var(--ink)}
#nav .ni[aria-current=page]{background:var(--sel);color:var(--ink);font-weight:600;border-left-color:var(--accent)}
#nav .ni small{margin-left:auto;color:var(--faint);font-size:12.5px;font-weight:400}
#nav .ni[aria-current=page] small{color:var(--ink2)}
#nav .grp{cursor:default;color:var(--ink);align-items:flex-start;padding-top:12px;margin-top:2px;border-top:1px solid var(--rule)}
#nav .grp b{display:block;font-weight:600;word-break:break-word}
#nav .grp small.sub{display:block;margin:2px 0 0;color:var(--ink2)}
#nav .dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
#nav .dot.on{background:var(--led);box-shadow:0 0 7px var(--led)}
.navgap{height:18px;border-bottom:1px solid var(--rule);margin-bottom:10px}
#nav .slotpick{width:100%;height:36px;padding:0 8px;font-size:15px;font-weight:600}
#nav .ni.grp{border-top:0;padding-top:6px;margin-top:0}
#prog{position:fixed;top:0;left:0;right:0;height:6px;z-index:50}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#prog.ind i{width:30%;animation:slide 1.2s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:70%}}
@media (prefers-reduced-motion:reduce){#prog.ind i{animation:none;width:100%;opacity:.5}}
#d-bar{width:260px;height:10px;accent-color:var(--accent);vertical-align:middle}
#savestat{color:var(--ink2);font-size:13px;align-self:center;margin-right:6px}
#devview tbody tr[data-slot],#devview tbody tr[data-bank]{cursor:default}
#devview tbody tr[data-slot]{cursor:pointer}
#devview tbody tr[data-slot]:hover td{background:var(--band)}
#devview tbody tr.cur td.nm{font-weight:600}
.here{margin-left:8px;color:var(--accent);font-family:var(--ui)}
.connchip{display:flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px}
.connchip i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.connchip.loop{border-color:var(--err);color:var(--err)}
.connchip.loop i{background:var(--err)}
.loopbox{border:1px solid var(--err);border-radius:6px;padding:12px 14px;margin:0 0 14px;line-height:1.45}
.connchip.on i{background:var(--led);box-shadow:0 0 6px var(--led)}
.dev{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--rule)}
.dev small{display:block;color:var(--ink2);margin-top:2px}
.dev.cur b::after{content:' (connected)';font-weight:400;color:var(--accent)}
.row2{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.warn{color:var(--warn);margin:8px 0}
#devview table{min-width:0;width:100%;user-select:text}
#devview th{position:static;cursor:default}
#devview td.nm{font-family:var(--mono);font-size:13px;max-width:none}
#devview td.ac{text-align:right;white-space:nowrap}
#devview th,#devview td{height:52px;padding:0 18px;max-width:none;overflow:visible}
#devview th{height:44px}
#devview td.ac button{margin-left:8px;padding:8px 0;width:84px}
#devview .sc input[type=text]{width:100%}
#devview td.slot{width:130px;font-family:var(--mono);font-size:13px;color:var(--ink2)}
#devlog{font:12px/1.6 var(--mono);color:var(--ink2);max-height:220px;overflow:auto;border-top:1px solid var(--rule);padding-top:8px}
#devlog .bad{color:var(--err)}
.pshow{font-family:var(--mono);font-size:13px;color:var(--ink2)}

#bar{display:flex;gap:14px;align-items:center;padding:0 18px;min-height:52px;background:var(--sheet);border-bottom:1px solid var(--rule)}
#crumb{font-size:17px;color:var(--ink2)}
#crumb .sep{margin:0 10px;color:var(--faint)}
#crumb b{color:var(--ink);font-weight:600}
\.tabs{display:flex;gap:4px}
#bar label{display:flex;gap:6px;align-items:center;color:var(--ink2)}
.grow{flex:1}

#main{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr) 440px;gap:0}
#settings,#devview{grid-column:2/-1;overflow:auto;background:var(--sheet);padding:28px 32px}
.settingsview #gridwrap,.settingsview #side{display:none}
.settingsview #hint{display:none}
#settings section,#devview section{max-width:820px;margin:0 0 36px}
#settings h2,#devview h2{margin:0 0 6px;font-size:18px;font-weight:600}
#settings .lead,#devview .lead{margin:0 0 14px;color:var(--ink2)}
.sf{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.sl b{display:block;font-weight:500}
.sl small{display:block;color:var(--ink2);margin-top:2px;line-height:1.35}
.sc input[type=text],.sc select{width:100%;height:34px;padding:0 10px;font-family:var(--mono);font-size:13px}
.sc input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
#gridwrap{overflow:auto;background:var(--sheet);position:relative}
table{border-collapse:separate;border-spacing:0;min-width:100%;user-select:none;-webkit-user-select:none}
th,td{height:28px;padding:0 7px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
thead th{position:sticky;top:0;z-index:3;background:var(--head);text-align:left;font-weight:600}
td.rh,th.rh{position:sticky;left:0;z-index:2;width:48px;min-width:48px;text-align:right;background:var(--band);font-family:var(--mono);font-size:12px;color:var(--ink2);cursor:default;padding-right:8px}
th.rh{z-index:4;background:var(--head)}
td.band,th.band{position:sticky;left:48px;z-index:2;width:150px;min-width:150px;max-width:150px;background:var(--band);color:var(--ink2);cursor:pointer;vertical-align:top;padding-top:6px;white-space:normal;line-height:1.15;border-right:1px solid var(--ink2)}
th.band{z-index:4;background:var(--head);color:var(--ink);vertical-align:middle;padding-top:0}
td.band:hover{background:var(--head);color:var(--ink)}
td.rh .led{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--led);margin-right:6px;vertical-align:middle;box-shadow:0 0 5px var(--led)}
tr.sel td.c{background:var(--sel)}
tr.sel td.rh{box-shadow:inset 4px 0 0 var(--accent)}
tr.sel td.rh{background:var(--sel);color:var(--ink)}
tr.inactive td.c{background-image:var(--hatch);color:var(--faint)}
td.c.na{background-image:var(--hatch);color:var(--faint)}
td.num{text-align:right;font-family:var(--mono);font-size:12.5px}
td.mono{font-family:var(--mono);font-size:12.5px}
td.err{color:var(--err);font-weight:600}
td.c .auto{color:var(--faint)}
.chip{display:inline-block;padding:1px 7px;border-radius:3px;font-weight:600;font-size:12.5px}
.t-raw{background:var(--band);color:var(--ink2)}.t-MMC{background:var(--t-pb)}.t-CC{background:var(--t-cc)}.t-NRPN{background:var(--t-nrpn)}.t-NOTE{background:var(--t-note)}.t-PC{background:var(--t-pc)}.t-AT{background:var(--t-at)}.t-GSXG{background:var(--t-gsxg)}.t-PB{background:var(--t-pb)}
td.empty-msg{height:120px;text-align:center;color:var(--ink2);border:0;max-width:none}

#side{border-left:1px solid var(--rule);background:var(--paper);overflow-y:auto;min-height:0}
#side h2{margin:0;font-size:14px;font-weight:600}
.sidehead{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--rule)}
.sidehead small{color:var(--ink2);margin-left:8px;font-weight:400}
#insp{padding:18px 20px 22px;display:grid;grid-template-columns:96px 1fr;gap:14px 14px;align-items:center;border-bottom:1px solid var(--rule)}
#insp[hidden]{display:none}
#insp .f{display:contents}
#insp .f>span{color:var(--ink2)}
#insp input,#insp select{width:100%;height:34px;padding:0 10px;font-family:var(--mono);font-size:13px;min-width:0}
#insp .ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
#insp .pair{display:flex;gap:10px;align-items:center}
#insp .stp{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px;flex:none}
#insp .stp input{width:64px;text-align:right}
#insp .sub{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:12px}
#insp .sub input{width:52px;flex:none}
#insp p.cap{grid-column:1/-1;margin:0 0 4px;color:var(--ink2);font-size:13px;line-height:1.4}
#insp .off em{color:var(--faint);font-style:normal}
#insp p.muted{grid-column:1/-1;margin:0;color:var(--ink2)}
#issues{border-top:0}
#issues ul{list-style:none;margin:0;padding:0}
#issues li{padding:8px 20px;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;gap:8px}
#issues li:hover{background:var(--band)}
#issues .e{color:var(--err);font-weight:600}
#issues .w{color:var(--warn);font-weight:600}
#issues p{margin:0;padding:12px 20px;color:var(--ink2)}

#dock{padding:10px 12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
#dock[hidden]{display:none}
#dock h3{margin:0;font-size:13px;font-weight:600}
#dock label{display:flex;flex-direction:column;gap:2px;color:var(--ink2);font-size:12px}
#dock .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
#dock textarea{width:100%;height:56px;resize:vertical;font-family:var(--mono);font-size:12.5px}
#dock input[type=text]{width:100px;font-family:var(--mono);font-size:12.5px}
#prev{font:12px/1.5 var(--mono);color:var(--ink2)}
#prev b{color:var(--ink);font-weight:500}
#prev .bad{color:var(--err)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:900px){#nav{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;padding:6px}#nav .ni{width:auto;padding:6px 12px}#nav .grp{border-top:0}#main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) 220px}#side{border-left:0;border-top:1px solid var(--rule)}}
</style>
</head>
<body>
<div id="prog" hidden><i></i></div>
<header id="top">
  <div class="brand">Gyra<small>BCR2000</small></div>
  <div class="actions">
    <button id="conn" class="connchip">No device</button>
    <span id="savestat"></span>
    <button id="open">Import file</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <input type="file" id="file" accept=".bcr,.bcf,.txt,.bc2,.syx" hidden>
  </div>
</header>

<div id="bar">
  <div id="crumb" aria-label="Location"></div>
  <span class="grow"></span>
  <span id="hint" style="color:var(--ink2)">Click rows to select them, shift or command click to add more, then edit in the panel. Delete clears the selected rows.</span>
</div>

<div id="main">
  <nav id="nav" aria-label="Device and preset outline"></nav>
  <div id="gridwrap"><table id="grid"><thead></thead><tbody></tbody></table></div>
  <div id="settings" hidden></div>
  <div id="devview" hidden></div>
  <aside id="side">
    <div class="sidehead"><h2>Selection</h2><span id="dcnt"></span></div>
    <div id="insp"></div>
    <div id="issues"></div>
  </aside>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- device model (see docs/03-bcl.md and docs/04-elements.md) ---------- */
const TYPES_B=['CC','NRPN','NOTE','PC','AT','GS/XG','MMC'];
const TYPES_E=['CC','NRPN','PC','PB','AT','GS/XG'];
const GS=['cutoff','resonance','v-rate','v-depth','v-delay','eg-attack','eg-decay','eg-release','modulation','p-time','volume','panorama','rev-send','crs-send','dly-send'];
const E_MODES=['absolute','relative-1','relative-2','relative-3','inc/dec','absolute/14','relative-1/14','relative-2/14','relative-3/14'];
const LEDS=['off','1dot','1dot/off','12dot','12dot/off','bar','bar/off','spread','pan','qual','cut','damp'];
const LEDS_SMALL=['off','1dot','1dot/off'];
const MMC_CMDS=['play','pause','stop','fwd','rew','locate','punch-in','punch-out'];
const MMC_FR=['noloc','24f','25f','30df','30f'];
const MMC_FRNUM={noloc:0,'24f':24,'25f':25,'30df':30,'30f':30};
const MMC_RATE={'24f':24,'25f':25,'30df':30,'30f':30};
function okLoc(s,fr){
  if(fr==='noloc')return /^[^\s;]+$/.test(s);
  const m=String(s).match(/^(\d\d):(\d\d):(\d\d)\.(\d\d)$/);
  return !!m&&+m[1]<=23&&+m[2]<=59&&+m[3]<=59&&+m[4]<MMC_RATE[fr];
}
const PR={CC:[0,127],NRPN:[0,16383],NOTE:[0,127],PC:[0,127],AT:[0,127],PB:[1,127]};
const VR={PC:[0,127],CC:[0,16383],NRPN:[0,16383],AT:[0,127],'GS/XG':[0,127],NOTE:[1,127]};
const COLS=[
  {k:'n',label:'No.',cls:'rh'},
  {k:'grp',label:'Group',cls:'band'},
  {k:'type',label:'Type',w:70},
  {k:'ch',label:'Ch',w:46,num:1},
  {k:'param',label:'Param',w:84,num:1},
  {k:'v1',label:'Value 1',w:72,num:1},
  {k:'v2',label:'Value 2',w:72,num:1},
  {k:'mode',label:'Mode',w:104,mono:1},
  {k:'inc',label:'Inc',w:46,num:1,only:'b'},
  {k:'led',label:'LEDs',w:84,mono:1,only:'e'},
  {k:'res',label:'Resolutions',w:128,mono:1,only:'e'},
  {k:'show',label:'Show',w:52},
  {k:'def',label:'Default',w:72,num:1},
];
const ENUM=new Set(['type','mode','led','show']);

function groupOf(kind,n){
  if(n<=32){const g=Math.ceil(n/8);return {key:'p'+g,name:'Push encoder group '+g}}
  if(kind==='e'){
    if(n<=40)return {key:'top',name:'Top row'};
    if(n<=48)return {key:'mid',name:'Middle row'};
    return {key:'bot',name:'Bottom row'};
  }
  if(n<=40)return {key:'ku',name:'Keys, upper row'};
  if(n<=48)return {key:'kl',name:'Keys, lower row'};
  if(n<=52)return {key:'us',name:'User keys'};
  if(n<=56)return {key:'fk',name:'STORE, LEARN, EDIT, EXIT'};
  if(n<=60)return {key:'eg',name:'Encoder group keys'};
  if(n<=62)return {key:'ft',name:'Foot switches'};
  return {key:'pk',name:'Preset keys'};
}
function blank(kind,n){
  return {id:kind+n,kind,n,g:groupOf(kind,n),raw:null,extra:[],type:'',ch:1,param:0,v1:0,v2:0,mode:'',inc:1,led:'off',res:'',resAuto:true,show:false,def:'',dirty:false};
}
const defaultPreset=()=>({name:'',egroups:4,snapshot:false,request:false,fkeys:true,lock:false,extra:[]});
const isDef=e=>!!(e.type||e.raw);
const defaultGlob=()=>({midimode:'U-3',startup:'last',footsw:'auto',rxch:'off',deviceid:1,txinterval:2,deadtime:0});
const blankEls=()=>{const a=[];for(let n=1;n<=64;n++)a.push(blank('b',n));for(let n=1;n<=56;n++)a.push(blank('e',n));return a};
const blankSlot=()=>({preset:defaultPreset(),els:blankEls()});
const newId=()=>'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let preset,els,glob;            // the open preset and global setup (preset and els point into the open bank)
let bank={slots:[]},B={id:null,name:'Untitled bank',src:{kind:'new'}},curSlot=0;
function useSlot(i){curSlot=i;preset=bank.slots[i].preset;els=bank.slots[i].els}
function newBank(name){bank={slots:Array.from({length:32},blankSlot)};glob=defaultGlob();B={id:newId(),name:name||'Untitled bank',src:{kind:'new'}};useSlot(0)}
function fresh(){newBank()}
const slotJSON=x=>({preset:x.preset,els:x.els.filter(isDef)});
function slotFrom(o){const x=blankSlot();Object.assign(x.preset,o.preset);for(const e of o.els){const t=x.els.find(y=>y.id===e.id);if(t)Object.assign(t,e,{dirty:false})}return x}
const bankJSON=()=>({name:B.name,src:B.src,glob,slots:bank.slots.map(slotJSON),cur:curSlot});
function bankFrom(o){bank={slots:o.slots.map(slotFrom)};glob=Object.assign(defaultGlob(),o.glob);B={id:B.id,name:o.name,src:o.src||{kind:'new'}};useSlot(Math.min(o.cur||0,31))}
const get=(k,n)=>els.find(e=>e.kind===k&&e.n===n);

function inactive(e){
  const eg=preset.egroups;
  if(e.n<=32&&Math.ceil(e.n/8)>eg)return 'Push encoder group '+Math.ceil(e.n/8)+' is off (encoder groups = '+eg+')';
  if(e.kind==='b'){
    if(e.n>=53&&e.n<=56&&preset.fkeys)return 'Works as a function key while Function keys is on';
    if(e.n>=57&&e.n<=60&&(e.n-56)<=eg)return 'Selects encoder group '+(e.n-56);
    if(e.n>=63&&!preset.lock)return 'Works as a preset key while Preset keys as buttons is off';
  }
  return '';
}

/* ---------- field logic ---------- */
const allowedTypes=e=>e.kind==='b'?TYPES_B:TYPES_E;
const modesFor=e=>{
  if(e.kind==='b'){
    if(e.type==='NOTE')return ['toggleoff','toggleon'];
    if(e.type==='PC')return ['down'];
    if(e.type==='MMC')return MMC_CMDS;
    return ['toggleoff','toggleon','increment'];
  }
  return E_MODES;
};
const ledsFor=e=>e.n>32?LEDS_SMALL:LEDS;

  const E=(col,m)=>out.push({sev:'e',col,msg:lbl+': '+m});
  const W=(m)=>out.push({sev:'w',msg:lbl+': '+m});
  const T=e.type;
  if(!isNA(e,'ch')&&!(e.ch>=1&&e.ch<=16))E('ch','Ch must be 1 to 16');
  if(!isNA(e,'param')&&T!=='MMC'&&!(T==='PC'&&e.param==='off')){
    if(T==='GS/XG'){if(!GS.includes(e.param))E('param','unknown GS/XG parameter')}

  }

}

/* ---------- library: banks are .bcr files in the banks folder, served by serve.py ---------- */
const NODB=/[?&](nodb|sim)\b/.test(location.search);
const LIB={ok:false,list:[],saved:'',timer:null,status:''};
const API='/api/banks',HDR={'X-Gyra':'1'};
async function libOpen(){
  if(NODB||location.protocol==='file:')return false;
  try{const r=await fetch(API,{headers:HDR});if(!r.ok)return false;LIB.ok=true;return true}catch(e){return false}
}
async function libAll(){
  const r=await fetch(API,{headers:HDR});
  return (await r.json()).map(x=>({id:x.file,name:x.file.replace(/\.bcr$/i,''),updated:x.mtime*1000,text:x.text}));
}
async function libPut(file,text){

  if(!r.ok)throw new Error('The server answered '+r.status+'.');
}
async function libDel(file){

}
const bankText=()=>bclBank().join('\n')+'\n';

  let f=safeFile(name),n=2;const base=f.replace(/\.bcr$/,'');

  LIB.status='Saving';renderSaveStat();
  clearTimeout(LIB.timer);
  LIB.timer=setTimeout(async()=>{
    try{await libPut(file,t);LIB.saved=t;LIB.status='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
    catch(e){LIB.status='Could not save: '+e.message}

}

    let j=i+1;while(j<buf.length&&buf[j]!==0xF7)j++;

function onMidi(inId,data){
  if(!data||data[0]!==0xF0)return;
  if(inId!=='sim-in'||SIM.loop)if(D.sent.includes(hexOf(data)))flagLoop(inId);
  D.listeners.forEach(l=>l(inId,data));
}
function outputs(){
  const o=[];
  if(D.access)D.access.outputs.forEach(p=>o.push({id:p.id,name:p.name,send:b=>{noteSent(b);p.send(b)}}));
  o.push({id:'sim-out',name:'Simulated BCR2000',send:b=>{noteSent(b);SIM.receive(b)}});
  return o;
}
const inputName=id=>id==='sim-in'?'Simulated BCR2000':((D.access&&D.access.inputs.get(id))||{}).name||id;
function wireInputs(){if(D.access)D.access.inputs.forEach(p=>{p.onmidimessage=e=>onMidi(p.id,e.data)})}
function onState(){
  wireInputs();
  if(D.dev&&D.dev.real&&!(D.access.outputs.get(D.dev.out)&&D.access.inputs.get(D.dev.inp))){D.dev=null;dlog('The MIDI ports of the device disappeared.',1)}
  renderConn();if(isDevPage())renderDevice();
}
function waitFor(pred,ms){
  return new Promise(res=>{
    let t;
    const l=(i,b)=>{if(pred(i,b)){clearTimeout(t);D.listeners.delete(l);res(b)}};
    D.listeners.add(l);
    t=setTimeout(()=>{D.listeners.delete(l);res(null)},ms);
  });
}
const fromDev=(i,b)=>D.dev&&i===D.dev.inp&&b[4]===D.dev.id&&b[5]===D.dev.model;
const dframe=(cmd,data)=>frame(D.dev.id,D.dev.model,cmd,data);
const progText=()=>D.progress+(D.busy&&D.pct>=0&&D.progress?'  '+Math.round(D.pct*100)+'%':'');
function setProgress(text,pct){D.progress=text;D.pct=pct;updateProgress()}
function updateProgress(){
  const e=$('#d-prog');if(e)e.textContent=progText();
  const bar=$('#d-bar');if(bar){bar.hidden=!D.busy;bar.value=D.pct>=0?Math.round(D.pct*1000):0;if(D.pct<0)bar.removeAttribute('value');else bar.value=Math.round(D.pct*1000)}
  const top=$('#prog');
  if(top){top.hidden=!D.busy;top.classList.toggle('ind',D.busy&&D.pct<0);top.firstElementChild.style.width=D.busy&&D.pct>=0?Math.round(D.pct*100)+'%':''}
}

async function detect(){
  if(D.busy)return;
  D.busy=true;D.found=[];D.msg='';D.loop=null;D.sent=[];setProgress('Detecting devices',-1);renderDevice();
  if(!NOHW&&D.supported&&!D.access){
    try{D.access=await navigator.requestMIDIAccess({sysex:true});wireInputs();D.access.onstatechange=onState}
    catch(e){D.msg='MIDI access was blocked ('+(e.message||e.name)+'). Allow MIDI and SysEx for this page in the browser site settings.';dlog(D.msg,1)}
  }
  const req=frame(0x7F,0x7F,0x01);
  for(const out of outputs()){
    const hits=[];
    const l=(i,b)=>{if(b[6]===0x02)hits.push({i,b:[...b]});else if(b.length===req.length&&b.every((x,k)=>x===req[k]))flagLoop(i,out.name)};
    D.listeners.add(l);
    out.send(req);
    let waited=0,first=null;
    while(waited<600){
      await sleep(20);waited+=20;
      if(hits.length&&first===null)first=waited;
      if(first!==null&&waited-first>=100)break;
    }
    D.listeners.delete(l);
    for(const h of hits){
      if(h.b.length===req.length&&h.b.every((x,k)=>x===req[k])){flagLoop(h.i,out.name);continue}
      D.found.push({out:out.id,send:out.send,real:out.id!=='sim-out',inp:h.i,outName:out.name,inName:inputName(h.i),id:h.b[4],model:h.b[5],ident:btext(h.b,7,h.b.length-1).trim()});
    }
  }
  D.busy=false;D.progress='';D.pct=0;updateProgress();
  dlog(D.found.length?`Found ${D.found.length} device${D.found.length>1?'s':''}.`:'No B-Control found on the MIDI ports.');
  renderDevice();
}
async function readChain(cmd,data,onLine){
  const lines=[];
  return new Promise((resolve,reject)=>{
    let t;
    const finish=(err,v)=>{clearTimeout(t);D.listeners.delete(l);err?reject(err):resolve(v)};
    const arm=()=>{clearTimeout(t);t=setTimeout(()=>finish(new Error('The device stopped replying after '+lines.length+' lines.')),2500)};
    const l=(i,b)=>{
      if(!fromDev(i,b)||b[6]!==0x20)return;
      const idx=(b[7]<<7)|b[8];
      if(idx===0&&lines.length%16384!==0)lines.length=0;
      if(idx!==lines.length%16384)return finish(new Error('Line '+idx+' arrived out of order.'));
      const tx=btext(b,9,b.length-1);
      lines.push(tx);arm();if(onLine)onLine(tx,lines.length);
      if(tx.trim()==='$end')finish(null,lines);
    };
    D.listeners.add(l);arm();
    D.dev.send(dframe(cmd,data));
  });
}
function describeLine(lines,i){
  let pre=1,el='';
  for(let k=0;k<=i;k++){
    const l=lines[k];
    if(/^\$store/.test(l))pre++;
    if(/^\$preset/.test(l))el='';
    const m=l.match(/^\$(button|encoder)\s+(\d+)/);if(m)el=m[1]+' '+m[2];
  }
  const g=lines.slice(0,i+1).some(l=>/^\$store/.test(l))||lines.some(l=>/^\$store/.test(l));
  return (g?'preset '+pre+', ':'')+(el?el+', ':'');
}
async function writeChain(lines,label,ctx){
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const p=waitFor((inp,b)=>fromDev(inp,b)&&b[6]===0x21&&b.length===11&&((b[7]<<7)|b[8])===i,2000);
    D.dev.send(dframe(0x20,[i>>7,i&127,...ascii(line)]));
    const base=ctx?ctx.base:0,total=ctx?ctx.total:lines.length;
    setProgress(`${label}: line ${base+i+1} of ${total}`,(base+i+1)/total);
    const r=await p;
    if(!r)throw new Error(`No reply for line ${i+1} (${describeLine(lines,i)}${line.trim()}).`);
    if(r[9]!==0)throw new Error(`The device rejected ${describeLine(lines,i)}${line.trim()}: ${BCL_ERR[r[9]]||'error '+r[9]}.`);
  }
}
function chainsBank(){
  const strip=a=>a.map(l=>l.replace(/^\s+/,''));
  const head=strip(['$rev R1',...globalBlock()]);
  const chains=[];let cur=[...head];
  bank.slots.forEach((x,i)=>{
    const blockLines=[...strip(presetBlock(x.preset,x.els)),'$store '+(i+1)];
    if(cur.length+blockLines.length+1>16000&&cur.length>head.length){chains.push([...cur,'$end']);cur=['$rev R1']}
    cur.push(...blockLines);
  });
  chains.push([...cur,'$end']);
  return chains;
}
async function run(label,fn){
  if(D.busy)return;
  D.busy=true;D.confirm=null;setProgress('Working',-1);renderDevice();
  try{await fn()}catch(e){dlog(label+' failed. '+e.message,1);toast(e.message)}
  D.busy=false;D.progress='';D.pct=0;renderDevice();renderConn();updateProgress();
}
let confirmTimer;
function askConfirm(key){
  D.confirm=key;renderDevice();
  clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{D.confirm=null;if(isDevPage())renderDevice()},4000);
}
function receiveBank(){run('Receive',async()=>{
  let last=0;
  setProgress('Waiting for the device',-1);
  const lines=await readChain(0x40,[0x7E],(tx,n)=>{
    const m=tx.match(/^\$store\s+(\d+)/);if(m)last=+m[1];
    setProgress(`Receiving: ${n} lines`+(last?`, preset ${last} of 32`:''),last?last/32:-1);
  });
  setProgress('Reading the bank',1);
  const r=parseBank(lines.join('\n'),true,true);
  const when=new Date().toISOString().slice(0,16).replace('T',' ');
  await addBank('BCR2000 '+when,{kind:'device'},()=>{applyParsed(r);return r});
  const filled=bank.slots.filter(x=>x.els.some(isDef)||x.preset.name.trim()).length;
  dlog(`Received ${lines.length} lines: global setup and ${filled} presets, saved as a new bank.`);
  toast('Received as a new bank.');
})}
function sendBank(){
  if(D.confirm!=='bank'){askConfirm('bank');return}
  run('Send',async()=>{
    const chains=chainsBank();let total=0;
    const grand=chains.reduce((a,c)=>a+c.length,0);
    for(let c=0;c<chains.length;c++){
      await writeChain(chains[c],'Sending bank',{base:total,total:grand});
      total+=chains[c].length;
    }
    dlog(`Sent the bank: global setup and 32 presets, ${total} lines${chains.length>1?' in '+chains.length+' parts':''}.`);
    toast('Bank sent to the device.');
  });
}
const slotWord=n=>n?'preset '+n:'the edit buffer';
function readPreset(n){run('Read',async()=>{
  setProgress('Reading '+slotWord(n),-1);
  const lines=await readChain(0x40,[n?n-1:0x7F],(tx,k)=>setProgress(`Reading ${slotWord(n)}: ${k} lines`,-1));
  const r=parseBank(lines.join('\n'),false,true);
  const target=n?n-1:curSlot;
  mutate(()=>{bank.slots[target]=r.temp;useSlot(target)});
  dlog(`Read ${slotWord(n)}: ${lines.length} lines${n?', stored in bank slot '+n:', now in the open preset'}.`);
  toast('Read '+slotWord(n)+'.');

function sendPreset(n){
  if(n&&D.confirm!=='p'+n){askConfirm('p'+n);return}
  run('Send',async()=>{
    const x=n?bank.slots[n-1]:bank.slots[curSlot];
    const lines=['$rev R1',...presetBlock(x.preset,x.els).map(l=>l.replace(/^\s+/,'')),...(n?['$store '+n]:[]),'$end'];
    await writeChain(lines,'Sending '+slotWord(n));
    dlog(`Sent ${slotWord(n)}: ${lines.length} lines.`);
    toast('Sent '+slotWord(n)+'.');
  });
}
function selectPreset(n){run('Select',async()=>{D.dev.send(dframe(0x22,[n-1]));dlog('Selected preset '+n+' on the device.')})}
function requestSnapshot(){run('Snapshot',async()=>{D.dev.send(dframe(0x43));dlog('Snapshot requested. The device sends it as MIDI on its outputs, not as BCL.')})}
function connect(i){
  const f=D.found[i];if(!f||f.model!==0x15)return;

/* simulated BCR2000: answers like the device, so transfers work without hardware */
const SIM={
  slots:{},temp:[],g:[],chain:[],expect:0,
  pad:n=>(n+' '.repeat(24)).slice(0,24),
  name(lines){const l=lines.find(x=>/^\s*\.name\s/.test(x));const m=l&&l.match(/'(.*)'/);return this.pad(m?m[1]:'')},
  mk(name,els){
    return ['$preset',`.name '${this.pad(name)}'`,'.snapshot off','.request off','.egroups 4','.fkeys on','.lock off','.init',...els.flat()];
  },
  enc:(n,ep,led)=>[`$encoder ${n}`,`.easypar ${ep}`,`.mode ${led}`,'.resolution 96 96 96 96'],
  btn:(n,ep,extra)=>[`$button ${n}`,`.easypar ${ep}`,...(extra||[])],
  init(){
    const strip=a=>a.map(l=>l.replace(/^\s+/,''));
    this.g=strip(globalBlock()).slice(1);
    this.slots[0]=strip(presetBlock(preset,els));
    this.temp=this.slots[0];
    this.slots[1]=this.mk('Mixer',[...Array(8)].map((_,k)=>this.enc(k+1,`CC 2 ${7+k} 0 127 absolute`,'bar')));
    this.slots[4]=this.mk('Drum pads',[...Array(8)].map((_,k)=>this.btn(33+k,`NOTE 10 ${36+k} 127 toggleoff`)));
    this.slots[9]=this.mk('Lead synth',[...Array(4)].map((_,k)=>this.enc(k+1,`CC 1 ${74+k} 0 127 absolute`,'1dot')));
  },
  empty(){return this.mk('',[])},
  frames(lines){return lines.map((t,i)=>frame(0,0x15,0x20,[i>>7,i&127,...ascii(t)]))},
  reply(fr){fr.forEach((f,i)=>setTimeout(()=>onMidi('sim-in',f),4+i*3))},
  presetLines(){
    const i=this.chain.lastIndexOf('$preset');
    return i<0?[]:this.chain.slice(i).filter(l=>!/^\$(store|end|rev|recall)/.test(l));
  },
  receive(b){
    if(this.loop)this.reply([Uint8Array.from(b)]);
    if(b[0]!==0xF0||b[1]!==0||b[2]!==0x20||b[3]!==0x32)return;
    const dev=b[4],model=b[5],cmd=b[6];
    if(!((dev===0x7F||dev===0)&&(model===0x7F||model===0x15)))return;
    const out=(c,d)=>frame(0,0x15,c,d);
    if(cmd===0x01)this.reply([out(0x02,ascii('BCR2000 1.10'))]);
    else if(cmd===0x40){
      const n=b[7];
      if(n===0x7E){
        const L=['$rev R1','$global',...this.g];
        Object.keys(this.slots).map(Number).sort((x,y)=>x-y).forEach(k=>L.push(...this.slots[k],'$store '+(k+1)));
        L.push('$end');
        this.reply(this.frames(L));
      }else{
        const lines=n===0x7F?this.temp:(this.slots[n]||this.empty());
        this.reply(this.frames(['$rev R1',...lines,'$end']));
      }
    }else if(cmd===0x41)this.reply(this.frames(['$rev R1','$global',...this.g,'$end']));
    else if(cmd===0x42){
      const n=b[7],nm=k=>out(0x21,[0,k,...ascii(this.name(k===0x7F?this.temp:(this.slots[k]||this.empty())))]);
      if(n===0x7E)this.reply([...Array(32).keys()].map(nm));else this.reply([nm(n)]);
    }else if(cmd===0x20){
      const idx=(b[7]<<7)|b[8],t=btext(b,9,b.length-1).trim();
      let err=0;
      if(idx===0){this.chain=[];this.expect=0}
      if(idx!==this.expect)err=22;
      else{
        this.expect++;this.chain.push(t);
        let m;
        if((m=t.match(/^\$store\s+(\d+)/))){const n=+m[1];if(n<1||n>32)err=11;else this.slots[n-1]=this.presetLines()}
        else if(t==='$end'){
          const pi=this.chain.lastIndexOf('$preset');
          if(pi>=0&&!this.chain.slice(pi).some(l=>/^\$store/.test(l)))this.temp=this.presetLines();
          const gi=this.chain.indexOf('$global');
          if(gi>=0){let j=gi+1;const g=[];while(j<this.chain.length&&this.chain[j][0]!=='$')g.push(this.chain[j++]);this.g=g}
        }
      }
      this.reply([out(0x21,[idx>>7,idx&127,err])]);
    }
  }
};

/* ---------- demo preset ---------- */
function seed(){
  fresh();
  preset.name='Synth + drums';
  const put=(kind,n,t,o)=>{const e=get(kind,n);applyType(e,t);Object.assign(e,o);if(kind==='e'&&e.resAuto)e.res=autoRes(e);return e};
  ['Cutoff','Resonance','Attack','Decay','Sustain','Release','LFO rate','LFO depth'].forEach((nm,i)=>put('e',1+i,'CC',{ch:1,param:74+i,show:true}));
  ['Osc1 coarse','Osc1 fine','Osc2 coarse','Osc2 fine','Sub level','Noise level','Drive','Unison'].forEach((nm,i)=>put('e',9+i,'NRPN',{ch:1,param:i,v2:16383,show:true}));
  ['Send A','Send B','Send C','Send D','Pan 1','Pan 2','Pan 3','Pan 4'].forEach((nm,i)=>put('e',17+i,'CC',{ch:2,param:20+i,mode:'relative-1',led:i<4?'bar':'pan'}));
  for(let i=0;i<8;i++)put('e',33+i,'CC',{ch:3,param:70+i,led:'1dot'});
  for(let i=0;i<8;i++)put('b',1+i,'CC',{ch:1,param:90+i,mode:'toggleon',def:0});
  for(let i=0;i<8;i++)put('b',33+i,'NOTE',{ch:10,param:36+i,v2:100});
  for(let i=0;i<4;i++)put('b',41+i,'CC',{ch:1,param:100+i,mode:'increment',v1:7,v2:0,inc:1,show:true});
  for(let i=0;i<4;i++)put('b',49+i,'PC',{ch:1,param:i});
  els.forEach(e=>e.dirty=false);
}
if(NODB){seed();B.name='Demo bank'}else newBank('My bank');

renderAll();
(async()=>{

  LIB.list=(await libAll()).sort((a,b)=>b.updated-a.updated);
  let last=null;try{last=localStorage.getItem('gyra.last')}catch(e){}
  if(!LIB.list.length){B.id=uniqueFile('My bank');B.name=B.id.replace(/\.bcr$/,'');await libPut(B.id,bankText());LIB.saved=bankText()}
  else{const rec=LIB.list.find(r=>r.id===last)||LIB.list[0];loadBankText(rec.text,rec.id);LIB.saved=bankText()}
  remember(B.id);
  renderAll();
})();
